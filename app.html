<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vila Jacuí</title><style>:root{--p:#59317c;--p2:#76509a;--ink:#211a26;--muted:#817786;--bg:#f6f3f7;--line:#e9e2ec;--soft:#eee6f3}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--ink);background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.head{position:relative;background:var(--p);color:#fff;padding:calc(15px + env(safe-area-inset-top)) 52px 15px 16px}.ey{font-size:9px;letter-spacing:1.5px;color:#d9c6e8;font-weight:800}.head h1{font-size:21px;margin:3px 0 0}.helpBtn{position:absolute;right:15px;bottom:15px;width:29px;height:29px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff12;color:#fff;font-weight:800}.nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 7px;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#776d7b;padding:10px 2px;border-radius:8px;font:700 10.5px inherit}.nav button.on{color:var(--p);background:var(--soft)}main{width:min(920px,100%);margin:auto;padding:17px 14px 54px}.view{display:none}.view.on{display:block}.hero{padding:7px 2px 17px}.hero small{display:block;color:var(--muted);font-weight:650}.hero b{display:block;color:var(--p);font-size:35px;line-height:1.05;margin:4px 0}.hero span,.sub{color:var(--muted);font-size:11.5px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-bottom:25px}.quick div{background:#fff;padding:14px}.quick b{display:block;color:var(--p);font-size:21px}.quick span{font-size:10px;color:var(--muted)}.title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:5px 0 14px}.title h2{margin:0;color:var(--p);font-size:24px}.primary,.secondary{border:0;border-radius:10px;padding:11px 14px;font-weight:750}.primary{background:var(--p);color:#fff}.secondary{background:var(--soft);color:var(--p)}.section{margin:25px 0}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.sectionHead h3{font-size:14px;color:#4e345f;margin:0}.sectionHead span{font-size:10px;color:var(--muted)}.attCat{border-top:1px solid var(--line);background:#fff}.attCat:last-child{border-bottom:1px solid var(--line)}.attCat summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px 11px}.attCat summary::-webkit-details-marker{display:none}.catLeft{display:flex;align-items:center;gap:10px}.catIcon{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;color:var(--p);font-size:12px;font-weight:800}.catName{font-weight:750}.catCount{font-size:11px;color:var(--muted)}.attRow{padding:11px 12px 11px 48px;border-top:1px solid #f0ebf2}.attRow b{display:block;font-size:12px}.attRow span{font-size:10.5px;color:#79588e}.search{display:grid;grid-template-columns:1fr 170px;gap:8px;margin-bottom:11px}.search input,.search select,.form input,.form select,.control select{width:100%;border:1px solid #e4dce8;background:#fff;border-radius:10px;min-height:46px;padding:10px 12px;font-size:16px}.people,.freqList{background:#fff;border-radius:14px;overflow:hidden}.person{display:flex;align-items:center;gap:11px;padding:12px;border-bottom:1px solid #f0ebf2}.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:12px}.personMain{flex:1}.personMain b{display:block}.personMain span{font-size:10.5px;color:var(--muted)}.badge{display:inline-block;margin-top:5px;font-size:9px;padding:3px 6px;border-radius:6px;background:#f3eef6;color:#684b78}.badge.att{background:#f6efe4;color:#805d24}.go{color:#8d7998;font-size:20px}.empty{text-align:center;color:#8a818d;padding:38px 10px}.profileHead{display:flex;align-items:center;gap:13px;padding-bottom:16px}.profileAvatar{width:54px;height:54px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}.profileHead h2{margin:0;color:var(--p);font-size:23px}.profileHead .secondary{margin-left:auto}.freqStrip{display:flex;gap:7px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:auto}.day{min-width:42px;text-align:center}.day small{display:block;font-size:8px;color:var(--muted);margin-bottom:5px}.dot{width:27px;height:27px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:#eee9f0;color:#8d8490}.dot.y{background:#e8f2eb;color:#34704a}.dot.n{background:#f6eaea;color:#9b4c4c}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:12px}.row span{color:#7c7280}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label,.control label{display:block;font-size:10.5px;color:#625668;font-weight:700;margin-bottom:6px}.never{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11px;color:#604a6c}.never input{width:18px!important;min-height:0!important;height:18px}.actions{grid-column:1/-1;display:flex;gap:8px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#eae3ee;border-radius:10px;padding:3px;margin-bottom:13px}.seg button{border:0;background:transparent;border-radius:8px;padding:9px;color:#6e6472;font-weight:700}.seg button.on{background:#fff;color:var(--p)}.bulk{display:flex;gap:6px;overflow:auto;margin:9px 0}.bulk button{white-space:nowrap;border:0;border-radius:8px;padding:8px 10px;background:var(--soft);color:var(--p);font-weight:700;font-size:10px}.freqPerson{background:#fff;border-bottom:1px solid #f0ebf2;padding:11px 12px}.freqHead{display:flex;align-items:center;gap:9px}.freqHead input{width:18px;height:18px;accent-color:var(--p)}.freqName{flex:1}.freqName b{display:block}.freqName span{font-size:10px;color:var(--muted)}.toggle{display:flex;gap:5px}.toggle button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;color:#655a69;font-size:10px}.toggle button.on{background:var(--soft);color:var(--p);font-weight:800}.freqSave{position:sticky;bottom:7px;padding:7px;background:#f6f3f7ed;border-radius:12px}.freqSave button{width:100%}.analysisHero{display:grid;grid-template-columns:1.2fr .8fr;background:var(--p);color:#fff;border-radius:15px;overflow:hidden;margin-bottom:14px}.analysisHero>div{padding:17px}.analysisHero>div+div{background:#ffffff12}.analysisHero small{font-size:9px;color:#ddcbea}.analysisHero b{display:block;font-size:27px;margin:4px 0}.compare{background:#fff;border-radius:14px;overflow:hidden}.compareRow{display:grid;grid-template-columns:minmax(120px,1fr) 1.2fr;gap:12px;padding:12px;border-bottom:1px solid var(--line);align-items:center}.compareRow b{font-size:11px}.compareRow small{display:block;color:var(--muted);font-size:9px}.barWrap{display:grid;grid-template-columns:1fr 35px;gap:7px;align-items:center}.bar{height:7px;background:#eee8f1;border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p2)}.barWrap strong{font-size:11px;color:var(--p);text-align:right}.trend{margin-top:14px;background:#fff;border-radius:14px;padding:14px}.trend h3{margin:0 0 14px;color:#4e345f;font-size:13px}.chart{height:120px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid var(--line)}.col{flex:1;text-align:center}.col i{display:block;width:100%;max-width:34px;margin:auto;background:var(--p2);border-radius:6px 6px 0 0;min-height:3px}.col small{display:block;font-size:8px;color:var(--muted);padding:5px 0}.help p{line-height:1.55;color:#706775}.back{border:0;background:none;color:var(--p);padding:0 0 12px;font-weight:750}@media(max-width:620px){main{padding:14px 12px 46px}.search,.form{grid-template-columns:1fr}.field.full,.actions{grid-column:1}.analysisHero{grid-template-columns:1fr}.compareRow{grid-template-columns:110px 1fr}.actions{position:sticky;bottom:7px;padding:7px;background:#f6f3f7ee}}</style></head><body><header class="head"><div class="ey">ALA VILA JACUÍ</div><h1>Recém-Conversos</h1><button class="helpBtn" onclick="show('help')">?</button></header><nav class="nav"><button data-v="overview" class="on">Visão Geral</button><button data-v="people">Pessoas</button><button data-v="freq">Frequência</button><button data-v="dashboard">Dashboard</button></nav><main><section id="overview" class="view on"></section><section id="people" class="view"></section><section id="freq" class="view"></section><section id="dashboard" class="view"></section><section id="help" class="view help"><div class="title"><div><h2>Como usar</h2><p class="sub">Informação para apoiar a correlação, sem criar uma nova lista de tarefas.</p></div></div><p><b>Visão Geral</b> reúne os sinais de atenção. <b>Pessoas</b> mostra o acompanhamento individual. <b>Frequência</b> registra domingos e templo. <b>Dashboard</b> compara os dados gerais e por organização.</p></section></main><script>const K='vjConversos',ORGS=['Quórum de Élderes','Sociedade de Socorro','Rapazes','Moças','Primária'],MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],FIRST='2026-07-05';let data=[],view='overview',freqMode='sunday';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{data=JSON.parse(localStorage.getItem(K)||'[]')}catch{data=[]}}function save(){localStorage.setItem(K,JSON.stringify(data));window.dispatchEvent(new StorageEvent('storage',{key:K,newValue:JSON.stringify(data)}))}function active(){return data.filter(x=>(x.statusMembro||'Ativo')==='Ativo')}function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function sundays(){let a=[],d=new Date(FIRST+'T12:00:00'),now=new Date();while(d<=now){a.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+7)}return a.reverse()}function months(){let a=[],d=new Date(2026,6,1),now=new Date();while(d<=now){a.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);d.setMonth(d.getMonth()+1)}return a.reverse()}function fmt(s){let [y,m,d]=s.split('-');return`${d}/${m}`}function absence(x){let n=0;for(let s of sundays()){let v=x.frequencia?.[s];if(v==='Faltou')n++;else break}return n}function overdue(x){if(x.nuncaEntrevistado||!x.ultimaEntrevista)return true;return(Date.now()-new Date(x.ultimaEntrevista+'T12:00:00'))/864e5>14}function cats(x){let a=[],n=absence(x);if(n>=2)a.push(['Ausências',`${n} domingos seguidos sem vir`,'A']);if(x.ministradores==='Não possui')a.push(['Ministrador/amigo','Sem ministradores/amigos','M']);if(overdue(x))a.push(['Entrevista/visita',x.nuncaEntrevistado||!x.ultimaEntrevista?'Sem entrevista/visita registrada':'Entrevista/visita há mais de 14 dias','E']);if(x.recomendacao==='Não possui')a.push(['Recomendação','Ainda não possui recomendação','R']);if(x.sacerdocio==='Não recebeu')a.push(['Sacerdócio','Ainda não recebeu o sacerdócio','S']);if(x.chamado==='Não possui')a.push(['Chamado','Ainda não possui chamado','C']);if(x.bencaoPatriarcal==='Não')a.push(['Bênção patriarcal','Ainda não recebeu a bênção patriarcal','B']);return a}function show(v,render=true){view=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(!render)return;if(v==='overview')renderOverview();if(v==='people')renderPeople();if(v==='freq')renderFreq();if(v==='dashboard')renderDashboard()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));function renderOverview(){let a=active(),att=a.filter(x=>cats(x).length),order=['Ausências','Ministrador/amigo','Entrevista/visita','Recomendação','Sacerdócio','Chamado','Bênção patriarcal'];$('#overview').innerHTML=`<div class="hero"><small>Em acompanhamento agora</small><b>${a.length}</b><span>recém-conversos ativos</span></div><div class="quick"><div><b>${a.length-att.length}</b><span>SEM SINAIS AGORA</span></div><div><b>${att.length}</b><span>VALE OBSERVAR</span></div></div><div class="section"><div class="sectionHead"><h3>Atenções</h3><span>por prioridade</span></div>${order.map(cat=>{let rows=a.flatMap(x=>cats(x).filter(c=>c[0]===cat).map(c=>({x,c})));if(!rows.length)return'';return`<details class="attCat"><summary><div class="catLeft"><span class="catIcon">${rows[0].c[2]}</span><span class="catName">${cat}</span></div><span class="catCount">${rows.length} ›</span></summary>${rows.map(r=>`<div class="attRow" onclick="openPerson('${esc(r.x.id)}')"><b>${esc(r.x.nome)}</b><span>${esc(r.c[1])}</span></div>`).join('')}</details>`}).join('')||'<div class="empty">Nenhum sinal de atenção agora.</div>'}</div>`}function renderPeople(){$('#people').innerHTML=`<div class="title"><div><h2>Pessoas</h2><p class="sub">Consulte primeiro; edite quando necessário.</p></div><button class="primary" onclick="editPerson()">+ Adicionar</button></div><div class="search"><input id="find" placeholder="Buscar por nome"><select id="org"><option value="">Todas as organizações</option>${ORGS.map(x=>`<option>${x}</option>`).join('')}</select></div><div id="plist" class="people"></div>`;$('#find').oninput=drawList;$('#org').onchange=drawList;drawList()}function drawList(){let n=$('#find').value.toLowerCase(),o=$('#org').value,a=data.filter(x=>(!n||String(x.nome).toLowerCase().includes(n))&&(!o||x.organizacao===o));$('#plist').innerHTML=a.length?a.map(x=>`<div class="person" onclick="openPerson('${esc(x.id)}')"><div class="avatar">${initials(x.nome)}</div><div class="personMain"><b>${esc(x.nome)}</b><span>${esc(x.organizacao||'')}</span><br><i class="badge ${cats(x).length?'att':''}">${cats(x).length?'Vale observar':'Acompanhamento regular'}</i></div><span class="go">›</span></div>`).join(''):'<div class="empty">Nenhuma pessoa encontrada.</div>'}function freqStrip(x){return sundays().slice(0,6).reverse().map(s=>{let v=x.frequencia?.[s];return`<div class="day"><small>${fmt(s)}</small><span class="dot ${v==='Veio'?'y':v==='Faltou'?'n':''}">${v==='Veio'?'✓':v==='Faltou'?'—':'·'}</span></div>`}).join('')}function openPerson(id){let x=data.find(y=>String(y.id)===String(id));if(!x)return;show('people',false);$('#people').innerHTML=`<button class="back" onclick="renderPeople()">‹ Pessoas</button><div class="profileHead"><div class="profileAvatar">${initials(x.nome)}</div><div><h2>${esc(x.nome)}</h2><p class="sub">${esc(x.organizacao||'')}</p></div><button class="secondary" onclick="editPerson('${esc(x.id)}')">Editar</button></div><div class="sectionHead"><h3>Frequência recente</h3><span>últimos domingos</span></div><div class="freqStrip">${freqStrip(x)}</div><div>${[['Status',x.statusMembro||'Ativo'],['Última entrevista/visita',x.nuncaEntrevistado?'Ainda não realizada':x.ultimaEntrevista||'Sem registro'],['Sacerdócio',x.sacerdocio],['Recomendação para o templo',x.recomendacao],['Ministradores/amigos',x.ministradores],['Chamado',x.chamado],['Bênção patriarcal',x.bencaoPatriarcal]].map(r=>`<div class="row"><span>${r[0]}</span><b>${esc(r[1]||'—')}</b></div>`).join('')}</div>`}function sel(id,label,opts,val=''){return`<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`}function editPerson(id){let x=id?data.find(y=>String(y.id)===String(id)):null;show('people',false);$('#people').innerHTML=`<button class="back" onclick="renderPeople()">‹ Cancelar</button><div class="title"><div><h2>${x?'Editar pessoa':'Adicionar pessoa'}</h2></div></div><form class="form" id="pf"><div class="field full"><label>Nome completo</label><input id="pn" required value="${esc(x?.nome||'')}"></div>${sel('po','Organização',ORGS,x?.organizacao)}${sel('ps','Status',['Ativo','Inativo'],x?.statusMembro||'Ativo')}<div class="field"><label>Última entrevista/visita</label><input id="pi" type="date" value="${esc(x?.ultimaEntrevista||'')}"><label class="never"><input id="pnever" type="checkbox" ${x?.nuncaEntrevistado||(!x?.ultimaEntrevista)?'checked':''}> Ainda não foi entrevistado(a)/visitado(a)</label></div>${sel('pp','Sacerdócio',['Não se aplica','Recebeu','Não recebeu'],x?.sacerdocio)}${sel('pr','Recomendação para o templo',['Não se aplica','Possui','Não possui'],x?.recomendacao)}${sel('pm','Ministradores/amigos',['Não se aplica','Possui','Não possui'],x?.ministradores)}${sel('pc','Chamado',['Não se aplica','Possui','Não possui'],x?.chamado)}${sel('pb','Bênção patriarcal',['Não se aplica','Sim','Não'],x?.bencaoPatriarcal)}<div class="actions"><button class="primary">Salvar</button><button class="secondary" type="button" onclick="renderPeople()">Cancelar</button></div></form>`;let cb=$('#pnever'),dt=$('#pi');function st(){dt.disabled=cb.checked;if(cb.checked)dt.value=''}cb.onchange=st;dt.onchange=()=>{if(dt.value)cb.checked=false};st();$('#pf').onsubmit=e=>{e.preventDefault();let base=x?{...x}:{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),frequencia:{},visitaTemplo:{}};Object.assign(base,{nome:$('#pn').value.trim(),organizacao:$('#po').value,statusMembro:$('#ps').value,ultimaEntrevista:cb.checked?'':$('#pi').value,nuncaEntrevistado:cb.checked,sacerdocio:$('#pp').value,recomendacao:$('#pr').value,ministradores:$('#pm').value,chamado:$('#pc').value,bencaoPatriarcal:$('#pb').value});if(x)data[data.indexOf(x)]=base;else data.push(base);save();openPerson(base.id)}}function renderFreq(){let vals=freqMode==='sunday'?sundays():months();$('#freq').innerHTML=`<div class="title"><div><h2>Frequência</h2><p class="sub">Registro rápido, individual ou em grupo.</p></div></div><div class="seg"><button class="${freqMode==='sunday'?'on':''}" onclick="freqMode='sunday';renderFreq()">Domingos</button><button class="${freqMode==='temple'?'on':''}" onclick="freqMode='temple';renderFreq()">Templo</button></div><div class="control"><label>Período</label><select id="period">${vals.map(v=>`<option value="${v}">${freqMode==='sunday'?fmt(v):MONTHS[+v.slice(5)-1]+' '+v.slice(0,4)}</option>`).join('')}</select></div><div class="bulk"><button onclick="selectAll(true)">Selecionar todos</button><button onclick="selectAll(false)">Limpar</button>${freqMode==='sunday'?'<button onclick="bulkMark(\'Veio\')">Marcar Veio</button><button onclick="bulkMark(\'Faltou\')">Marcar Faltou</button>':'<button onclick="bulkMark(\'Foi\')">Marcar Foi</button><button onclick="bulkMark(\'Não foi\')">Marcar Não foi</button>'}</div><div id="flist" class="freqList"></div><div class="freqSave"><button class="primary" onclick="saveFreq()">Salvar alterações</button></div>`;$('#period').onchange=drawFreq;drawFreq()}function drawFreq(){let p=$('#period').value;$('#flist').innerHTML=active().map(x=>{let v=freqMode==='sunday'?x.frequencia?.[p]:x.visitaTemplo?.[p],opts=freqMode==='sunday'?['Veio','Faltou']:['Foi','Não foi'];return`<div class="freqPerson" data-id="${esc(x.id)}" data-value="${esc(v||'')}"><div class="freqHead"><input type="checkbox" class="pick"><div class="freqName"><b>${esc(x.nome)}</b><span>${esc(x.organizacao||'')}</span></div><div class="toggle">${opts.map(o=>`<button class="${v===o?'on':''}" onclick="mark(this,'${o}')">${o}</button>`).join('')}</div></div></div>`}).join('')}function mark(b,v){let c=b.closest('.freqPerson');c.dataset.value=c.dataset.value===v?'':v;c.querySelectorAll('.toggle button').forEach(x=>x.classList.toggle('on',x.textContent===c.dataset.value))}function selectAll(v){document.querySelectorAll('.pick').forEach(x=>x.checked=v)}function bulkMark(v){document.querySelectorAll('.freqPerson').forEach(c=>{if(c.querySelector('.pick').checked){c.dataset.value=v;c.querySelectorAll('.toggle button').forEach(x=>x.classList.toggle('on',x.textContent===v))}})}function saveFreq(){let p=$('#period').value;document.querySelectorAll('.freqPerson').forEach(c=>{let x=data.find(y=>String(y.id)===c.dataset.id);if(freqMode==='sunday'){x.frequencia=x.frequencia||{};if(c.dataset.value)x.frequencia[p]=c.dataset.value;else delete x.frequencia[p]}else{x.visitaTemplo=x.visitaTemplo||{};if(c.dataset.value)x.visitaTemplo[p]=c.dataset.value;else delete x.visitaTemplo[p]}});save();let b=$('.freqSave button');b.textContent='Salvo ✓';setTimeout(()=>b.textContent='Salvar alterações',900)}function rate(g,ss){let r=0,t=0;g.forEach(x=>ss.forEach(s=>{let v=x.frequencia?.[s];if(v==='Veio'||v==='Faltou'){t++;if(v==='Veio')r++}}));return{r,t,p:t?Math.round(r/t*100):0}}function renderDashboard(){let a=active(),ss=sundays().slice(0,6),all=rate(a,ss),latest=ss[0],lw=rate(a,latest?[latest]:[]),rows=ORGS.map(o=>{let g=a.filter(x=>x.organizacao===o);return{o,g,r:rate(g,ss)}}).filter(x=>x.g.length);$('#dashboard').innerHTML=`<div class="title"><div><h2>Dashboard</h2><p class="sub">Geral e organizações lado a lado.</p></div></div><div class="analysisHero"><div><small>FREQUÊNCIA GERAL · 6 SEMANAS</small><b>${all.p}%</b><span>${all.r} presenças em ${all.t} registros</span></div><div><small>ÚLTIMO DOMINGO${latest?' · '+fmt(latest):''}</small><b>${lw.p}%</b><span>${lw.r} de ${lw.t} registros</span></div></div><div class="section"><div class="sectionHead"><h3>Geral × organizações</h3><span>6 semanas</span></div><div class="compare">${[{o:'Geral',g:a,r:all},...rows].map(x=>`<div class="compareRow"><div><b>${x.o}</b><small>${x.g.length} pessoas</small></div><div class="barWrap"><div class="bar"><i style="width:${x.r.p}%"></i></div><strong>${x.r.p}%</strong></div></div>`).join('')}</div></div><div class="trend"><h3>Evolução geral por domingo</h3><div class="chart">${ss.slice().reverse().map(s=>{let r=rate(a,[s]);return`<div class="col"><i style="height:${Math.max(3,r.p)}px"></i><small>${fmt(s)}</small></div>`}).join('')}</div></div>`}window.vjApplyCloud

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vila Jacuí</title><style>html,body,#legacy{margin:0;width:100%;height:100%;border:0}body{padding:0!important}</style></head><body><iframe id="legacy" src="app-original.html"></iframe><script>const f=document.getElementById('legacy');f.addEventListener('load',()=>{try{const d=f.contentDocument,l=d.createElement('link');l.rel='stylesheet';l.href='modern-ui.css?v=5';d.head.appendChild(l);const hide=()=>{['exportDataBtn','importDataBtn','importFileInput'].forEach(id=>d.getElementById(id)?.remove())};hide();new MutationObserver(hide).observe(d.body,{childList:true,subtree:true});const help=d.getElementById('tab-comousar');if(help)help.innerHTML=`<div class="card"><h2>Como usar o app</h2><p class="card-sub">O acompanhamento é compartilhado e sincronizado. As alterações feitas por um participante ficam disponíveis para os demais dispositivos conectados.</p><div class="profile-grid" style="grid-template-columns:1fr"><div class="profile-item"><span class="profile-label">Conversos</span>Cadastre e atualize os recém-conversos, incluindo organização, sacerdócio, recomendação para o templo, ministradores ou amigos, chamado e bênção patriarcal.</div><div class="profile-item"><span class="profile-label">Frequência</span>Registre a presença dominical e a visita mensal ao templo. Selecione a semana ou o mês correspondente antes de salvar.</div><div class="profile-item"><span class="profile-label">Dashboard</span>Acompanhe indicadores gerais, dados por organização, frequência por período e o perfil individual de cada recém-converso.</div></div></div><div class="card"><h2>Acesso e sincronização</h2><p class="card-sub">Não é mais necessário exportar ou importar arquivos para compartilhar atualizações.</p><div class="profile-grid" style="grid-template-columns:1fr"><div class="profile-item"><span class="profile-label">1. Entre no app</span>Abra o endereço do aplicativo no celular ou computador e informe a senha de acesso.</div><div class="profile-item"><span class="profile-label">2. Faça as alterações normalmente</span>Cadastros, edições e registros de acompanhamento são enviados para a base compartilhada quando salvos.</div><div class="profile-item"><span class="profile-label">3. Outros dispositivos recebem as mudanças</span>O app consulta periodicamente os dados compartilhados. Ao voltar para o aplicativo, ele também verifica se existem atualizações.</div><div class="profile-item"><span class="profile-label">Conexão com a internet</span>Para receber e enviar alterações compartilhadas, o dispositivo precisa estar conectado à internet.</div></div></div><div class="card"><h2>Rotina sugerida</h2><p class="card-sub">Um fluxo simples para manter o acompanhamento atualizado.</p><div class="profile-grid" style="grid-template-columns:1fr"><div class="profile-item"><span class="profile-label">Antes da correlação</span>Confira novos cadastros e atualize informações de sacerdócio, recomendação, ministração, chamado e demais indicadores.</div><div class="profile-item"><span class="profile-label">Após as reuniões de domingo</span>Na aba Frequência, registre quem veio e salve as alterações.</div><div class="profile-item"><span class="profile-label">Durante o mês</span>Atualize a visita ao templo no mês correspondente quando houver novas informações.</div><div class="profile-item"><span class="profile-label">Na correlação</span>Use o Dashboard para visualizar necessidades, indicadores e frequência sem precisar preparar arquivos separados.</div></div></div><div class="card"><h2>Relatórios</h2><p class="card-sub">A sincronização dos dados e a geração de relatórios são funções diferentes.</p><div class="profile-grid" style="grid-template-columns:1fr"><div class="profile-item"><span class="profile-label">Excel e PDF</span>Os botões de relatório do Dashboard continuam disponíveis quando você quiser gerar uma planilha ou PDF para consulta. Eles não são necessários para sincronizar o aplicativo.</div><div class="profile-item"><span class="profile-label">Dados compartilhados</span>Não é necessário criar backup JSON manual para passar informações de um aparelho para outro. O app utiliza a base compartilhada para isso.</div></div></div>`;}catch(e){}})</script></body></html>

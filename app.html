<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Vila Jacuí</title><style>html,body,#legacy{margin:0;width:100%;height:100%;border:0;overflow:hidden}body{padding:0!important}</style></head><body><iframe id="legacy" src="app-original.html"></iframe><script>const f=document.getElementById('legacy');f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow,l=d.createElement('link');l.rel='stylesheet';l.href='modern-ui.css?v=8';d.head.appendChild(l);let vp=d.querySelector('meta[name=viewport]');if(vp)vp.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';const hide=()=>{['exportDataBtn','importDataBtn','importFileInput'].forEach(id=>d.getElementById(id)?.remove())};hide();new MutationObserver(hide).observe(d.body,{childList:true,subtree:true});const buttons=[...d.querySelectorAll('nav.tabs .tab-btn')];buttons.forEach(b=>{const t=b.dataset.tab;if(t==='conversos')b.textContent='Pessoas';if(t==='frequencia')b.textContent='Frequência';if(t==='dashboard')b.textContent='Visão Geral';if(t==='comousar')b.textContent='Ajuda'});const formTitle=d.getElementById('formTitle');if(formTitle)formTitle.textContent='Adicionar pessoa';const conv=d.getElementById('tab-conversos');if(conv){const cards=conv.querySelectorAll(':scope > .card');if(cards[0]){const p=cards[0].querySelector('.card-sub');if(p)p.textContent='Mantenha somente as informações que ajudam no acompanhamento atual.'}if(cards[1]){const h=cards[1].querySelector('h2'),p=cards[1].querySelector('.card-sub');if(h)h.textContent='Pessoas acompanhadas';if(p)p.textContent='Encontre rapidamente uma pessoa ou filtre pela organização.'}}const dash=d.getElementById('tab-dashboard');if(dash){const cards=dash.querySelectorAll(':scope > .card');if(cards[0]){const h=cards[0].querySelector('h2'),p=cards[0].querySelector('.card-sub');if(h)h.textContent='Visão Geral';if(p)p.textContent='Use os filtros apenas quando quiser olhar uma organização ou pessoa específica.'}if(cards[1]){const h=cards[1].querySelector('h2'),p=cards[1].querySelector('.card-sub');if(h)h.textContent='Situação do acompanhamento';if(p)p.textContent='Uma leitura rápida dos dados atuais, sem criar novas tarefas para os líderes.'}if(cards[2]){const h=cards[2].querySelector('h2');if(h)h.textContent='Por organização'}if(cards[3]){const h=cards[3].querySelector('h2');if(h)h.textContent='Frequência recente'}}const help=d.getElementById('tab-comousar');if(help)help.innerHTML=`<div class="card"><h2>Como usar</h2><p class="card-sub">O app foi pensado para apoiar a correlação sem criar uma lista extra de tarefas para os líderes.</p><div class="profile-grid" style="grid-template-columns:1fr"><div class="profile-item"><span class="profile-label">Pessoas</span>Cadastre e atualize somente informações úteis para entender a situação atual de cada recém-converso.</div><div class="profile-item"><span class="profile-label">Frequência</span>Registre presença dominical e visita mensal ao templo.</div><div class="profile-item"><span class="profile-label">Visão Geral</span>Use os indicadores como sinais para a conversa da liderança. O app informa; a correlação decide o que fazer.</div></div></div><div class="card"><h2>Sincronização</h2><p class="card-sub">As alterações são compartilhadas automaticamente entre os dispositivos conectados. Não é necessário exportar ou importar arquivos para atualizar os dados.</p><div class="profile-grid" style="grid-template-columns:1fr"><div class="profile-item"><span class="profile-label">Ao salvar</span>O app envia a alteração para a base compartilhada sem precisar recarregar a tela.</div><div class="profile-item"><span class="profile-label">Outros dispositivos</span>As mudanças são verificadas periodicamente. É necessária conexão com a internet para enviar e receber atualizações.</div></div></div><div class="card"><h2>Relatórios</h2><p class="card-sub">Excel e PDF continuam disponíveis na Visão Geral quando forem úteis para consulta. Eles não são necessários para sincronizar o app.</p></div>`;const footer=d.querySelector('footer.app-footer');if(footer)footer.textContent='Obra Missionária · Ala Vila Jacuí — Uso interno. Dados sincronizados com a base compartilhada.';}catch(e){}})</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vila Jacuí MW</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f0fa}#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#3a2255,#6b3fa0)}.card{box-sizing:border-box;width:min(390px,100%);background:#fff;border-radius:24px;padding:32px 25px;text-align:center;box-shadow:0 24px 70px #180c2b55}.card img{width:76px;height:76px;border-radius:50%;object-fit:cover}.k{margin-top:14px;font-size:11px;letter-spacing:1.7px;font-weight:800;color:#6b3fa0}.card h1{font-size:22px;line-height:1.2;color:#3a2255;margin:6px 0}.card p{font-size:13px;color:#726a7e;margin:0 0 20px}.card input{box-sizing:border-box;width:100%;border:1.5px solid #e1d5f0;border-radius:12px;padding:14px;font-size:16px;outline:none}.card button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;background:#6b3fa0;color:#fff;font-weight:800;font-size:15px}.err{min-height:18px;color:#c62828;font-size:12px;margin-top:9px}#bar{display:none;height:38px;box-sizing:border-box;background:#3a2255;color:#fff;align-items:center;justify-content:center;font-size:12px;font-weight:700;gap:9px}#dot{color:#a5f0aa}iframe{display:none;border:0;width:100%;height:calc(100vh - 38px);background:#fff}</style></head><body><div id="gate"><div class="card"><img src="vj_logo.png"><div class="k">ALA VILA JACUÍ</div><h1>Acompanhamento de Recém-Conversos</h1><p>Acesso interno · dados sincronizados</p><form id="f"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button><div class="err" id="err"></div></form></div></div><div id="bar"><span id="dot">●</span><span id="st">Sincronizado</span></div><iframe id="app" src="about:blank"></iframe><script>const API='https://fttvimhhxopvzxqrpsuk.supabase.co/functions/v1/mw-shared',KEY='vj_mw_access',DATA='vjConversos';let pw=localStorage.getItem(KEY)||'',last='',busy=false;const q=id=>document.getElementById(id);async function req(action,payload){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password:pw,payload})});if(!r.ok)throw Error(r.status===401?'Senha incorreta':'Falha de conexão');return r.json()}function status(t,ok=true){q('st').textContent=t;q('dot').style.color=ok?'#a5f0aa':'#ffd08a'}async function push(){if(!pw||busy)return;let raw=localStorage.getItem(DATA)||'[]';if(raw===last)return;try{await req('set',{conversos:JSON.parse(raw)});last=raw;status('Sincronizado')}catch(e){status('Não sincronizado',false)}}async function pull(initial=false){if(!pw||busy)return;try{let d=await req('get'),arr=Array.isArray(d?.payload?.conversos)?d.payload.conversos:[],cloud=JSON.stringify(arr),local=localStorage.getItem(DATA)||'[]';if(initial&&arr.length===0&&local!=='[]'){await req('set',{conversos:JSON.parse(local)});last=local}else if(cloud!==local){busy=true;localStorage.setItem(DATA,cloud);last=cloud;busy=false;if(!initial&&q('app').src!=='about:blank')q('app').contentWindow.location.reload()}else last=cloud;status('Sincronizado')}catch(e){status('Sem conexão',false);if(initial)throw e}}async function openApp(){await pull(true);q('gate').style.display='none';q('bar').style.display='flex';q('app').style.display='block';q('app').src='app.html';setInterval(()=>{push();pull()},3000);window.addEventListener('focus',()=>pull())}q('f').onsubmit=async e=>{e.preventDefault();let b=e.currentTarget.querySelector('button');pw=q('pw').value;b.disabled=true;b.textContent='Entrando…';q('err').textContent='';try{await req('get');localStorage.setItem(KEY,pw);await openApp()}catch(x){pw='';q('err').textContent=x.message;b.disabled=false;b.textContent='Entrar'}};if(pw){req('get').then(openApp).catch(()=>{localStorage.removeItem(KEY);pw=''})}window.addEventListener('storage',e=>{if(e.key===DATA)push()});</script></body></html>

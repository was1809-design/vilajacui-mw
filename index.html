<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vila Jacuí MW</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;background:#f7f6f8;color:#17151b}#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#fff 0,#f7f6f8 45%,#eeeaf1 100%)}.login{width:min(360px,100%);text-align:center}.login img{width:70px;height:70px;border-radius:50%;object-fit:cover;box-shadow:0 10px 30px #3c29471a}.k{margin-top:18px;font-size:10px;letter-spacing:1.8px;font-weight:750;color:#7047a3}.login h1{font-size:25px;line-height:1.08;letter-spacing:-.7px;margin:7px 0;color:#17151b}.login p{font-size:13px;color:#79747f;margin:0 0 25px}.login input{width:100%;height:52px;border:0;border-radius:15px;padding:0 16px;font-size:16px;background:#fff;outline:none;box-shadow:inset 0 0 0 1px #e8e4eb}.login input:focus{box-shadow:inset 0 0 0 2px #9a78bd,0 0 0 4px #7047a314}.login button{width:100%;height:50px;border:0;border-radius:15px;margin-top:10px;background:#7047a3;color:#fff;font-weight:750;font-size:15px}.err{min-height:20px;color:#b3261e;font-size:12px;margin-top:10px}#bar{display:none;height:30px;background:#f7f6f8;color:#77717c;align-items:center;justify-content:center;font-size:11px;font-weight:650;gap:6px;border-bottom:1px solid #ebe8ee}#dot{color:#2f8f55;font-size:8px}iframe{display:none;border:0;width:100%;height:calc(100vh - 30px);background:#f7f6f8}</style></head><body><div id="gate"><div class="login"><img src="vj_logo.png"><div class="k">ALA VILA JACUÍ</div><h1>Acompanhamento de Recém-Conversos</h1><p>Acesso interno · sincronização automática</p><form id="f"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button><div class="err" id="err"></div></form></div></div><div id="bar"><span id="dot">●</span><span id="st">Sincronizado</span></div><iframe id="app" src="about:blank"></iframe><script>const API='https://fttvimhhxopvzxqrpsuk.supabase.co/functions/v1/mw-shared',KEY='vj_mw_access',DATA='vjConversos';let pw=localStorage.getItem(KEY)||'',last='',busy=false;const q=id=>document.getElementById(id);async function req(action,payload){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password:pw,payload})});if(!r.ok)throw Error(r.status===401?'Senha incorreta':'Falha de conexão');return r.json()}function status(t,ok=true){q('st').textContent=t;q('dot').style.color=ok?'#2f8f55':'#b7791f'}async function push(){if(!pw||busy)return;let raw=localStorage.getItem(DATA)||'[]';if(raw===last)return;try{await req('set',{conversos:JSON.parse(raw)});last=raw;status('Sincronizado')}catch(e){status('Não sincronizado',false)}}async function pull(initial=false){if(!pw||busy)return;try{let d=await req('get'),arr=Array.isArray(d?.payload?.conversos)?d.payload.conversos:[],cloud=JSON.stringify(arr),local=localStorage.getItem(DATA)||'[]';if(initial&&arr.length===0&&local!=='[]'){await req('set',{conversos:JSON.parse(local)});last=local}else if(cloud!==local){busy=true;localStorage.setItem(DATA,cloud);last=cloud;busy=false;if(!initial&&q('app').src!=='about:blank')q('app').contentWindow.location.reload()}else last=cloud;status('Sincronizado')}catch(e){status('Sem conexão',false);if(initial)throw e}}async function openApp(){await pull(true);q('gate').style.display='none';q('bar').style.display='flex';q('app').style.display='block';q('app').src='app.html?v=4';setInterval(()=>{push();pull()},3000);window.addEventListener('focus',()=>pull())}q('f').onsubmit=async e=>{e.preventDefault();let b=e.currentTarget.querySelector('button');pw=q('pw').value;b.disabled=true;b.textContent='Entrando…';q('err').textContent='';try{await req('get');localStorage.setItem(KEY,pw);await openApp()}catch(x){pw='';q('err').textContent=x.message;b.disabled=false;b.textContent='Entrar'}};if(pw){req('get').then(openApp).catch(()=>{localStorage.removeItem(KEY);pw=''})}window.addEventListener('storage',e=>{if(e.key===DATA)push()});</script></body></html>
